name: publish
# Pushes, signs and attests the image that image.yml built in the same run (one index for
# linux/amd64 and linux/arm64), mirrors its base images with their records and sources, and
# verifies it all as a consumer would, offline too, on both platforms
# (docs/decisions/0006-release-artifacts-and-signing.md). Called by release.yml after image.yml;
# never on push or PR, so they never hold package-write permission.
on:
  workflow_call:
    # Both live only in the `release` environment, which the publish job names. The caller still
    # has to pass them by name, or they're silently empty here (#103); required makes a call
    # without them fail to start. Only the job in the environment gets their values.
    secrets:
      COSIGN_PRIVATE_KEY:
        required: true
      COSIGN_PASSWORD:
        required: true
    outputs:
      digest:
        value: ${{ jobs.publish.outputs.digest }}
      digest_amd64:
        value: ${{ jobs.publish.outputs.digest_amd64 }}
      digest_arm64:
        value: ${{ jobs.publish.outputs.digest_arm64 }}
      digest_ubi9:
        value: ${{ jobs.publish.outputs.digest_ubi9 }}
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Only v* tags may use it, and a person approves each run before anything is signed.
    environment: release
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      digest_amd64: ${{ steps.push.outputs.digest_amd64 }}
      digest_arm64: ${{ steps.push.outputs.digest_arm64 }}
      digest_ubi9: ${{ steps.push-ubi9.outputs.digest_ubi9 }}
    env:
      IMAGE: ghcr.io/joehazurmoney/wd2l
      # The comparison image on UBI 9, amd64 only (#192): published and verified like IMAGE.
      UBI9: ghcr.io/joehazurmoney/wd2l-ubi9
      BASE_MIRROR: ghcr.io/joehazurmoney/wd2l-base/python
      ATT: https://github.com/JoeHazurmoney/architecture-wiredata-to-log/attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The signing key is cosign.pub's, before anything is pushed
        # An empty or wrong key, or a wrong password, otherwise fails only at signing, after the
        # images are pushed (#103).
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          TOOL_ENV: COSIGN_PRIVATE_KEY COSIGN_PASSWORD
        run: |
          packaging/ci/tool cosign public-key --key env://COSIGN_PRIVATE_KEY > derived.pub
          diff -q derived.pub cosign.pub || { echo "::error::The release environment's key isn't cosign.pub's"; exit 1; }
      # One download per artifact, by name: the image archives and evidence of each platform.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: base-evidence
          path: base-evidence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-amd64
          path: image-amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-arm64
          path: image-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-info-amd64
          path: build-info-amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-info-arm64
          path: build-info-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-amd64
          path: sbom-amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-arm64
          path: sbom-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vuln-amd64
          path: vuln-amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vuln-arm64
          path: vuln-arm64
      # The comparison image's (#192).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-ubi9-amd64
          path: image-ubi9-amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-info-ubi9-amd64
          path: build-info-ubi9-amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-ubi9-amd64
          path: sbom-ubi9-amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vuln-ubi9-amd64
          path: vuln-ubi9-amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: base-evidence-ubi9
          path: base-evidence-ubi9
      - id: v
        run: python3 packaging/release/versions.py --github-output "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - id: push
        name: Push one index for both platforms, with each tag, and check it holds the tested images
        run: |
          podman manifest create localhost/wd2l:release
          for a in amd64 arm64; do podman manifest add localhost/wd2l:release "oci-archive:image-$a/image.oci.tar"; done
          set -- ${{ steps.v.outputs.image_tags }}
          podman manifest push --all --format oci --digestfile digest.txt localhost/wd2l:release "docker://$IMAGE:$1"
          D=$(cat digest.txt); shift
          skopeo inspect --raw "docker://$IMAGE@$D" > index.json
          for a in amd64 arm64; do
            c=$(jq -r --arg a $a '.manifests[] | select(.platform.architecture == $a) | .digest' index.json)
            skopeo inspect --raw "docker://$IMAGE@$c" > "manifest-$a.json"
          done
          python3 packaging/release/image_index.py --index index.json --digest "$D" \
            --manifest amd64=manifest-amd64.json --manifest arm64=manifest-arm64.json \
            --build-info amd64=build-info-amd64/build-info.json --build-info arm64=build-info-arm64/build-info.json \
            --github-output "$GITHUB_OUTPUT"
          # The other tags only once the index holds exactly the tested images.
          for t in "$@"; do packaging/ci/tool oras tag --registry-config /auth/config.json "$IMAGE@$D" "$t"; done
          # Customers pull by tag: each one, read back, must serve this index (#161).
          for t in ${{ steps.v.outputs.image_tags }}; do
            got="sha256:$(skopeo inspect --raw "docker://$IMAGE:$t" | sha256sum | cut -d' ' -f1)"
            [ "$got" = "$D" ] || { echo "::error::$IMAGE:$t serves $got, not the index $D"; exit 1; }
          done
          echo "digest=$D" >> "$GITHUB_OUTPUT"
      - id: push-ubi9
        name: Push the comparison image (UBI 9, amd64), with each tag, and check it is the tested image
        run: |
          set -- ${{ steps.v.outputs.image_tags }}
          skopeo copy -q --digestfile ubi9-digest.txt "oci-archive:image-ubi9-amd64/image.oci.tar" "docker://$UBI9:$1"
          D=$(cat ubi9-digest.txt); shift
          # The image ID (its config's digest) is what ubi9-checks rebuilt and checked.
          got=$(skopeo inspect --raw "docker://$UBI9@$D" | jq -r .config.digest)
          want="sha256:$(jq -r .image_id build-info-ubi9-amd64/build-info.json)"
          [ "$got" = "$want" ] || { echo "::error::$UBI9@$D holds $got, not the tested $want"; exit 1; }
          for t in "$@"; do packaging/ci/tool oras tag --registry-config /auth/config.json "$UBI9@$D" "$t"; done
          for t in ${{ steps.v.outputs.image_tags }}; do
            got="sha256:$(skopeo inspect --raw "docker://$UBI9:$t" | sha256sum | cut -d' ' -f1)"
            [ "$got" = "$D" ] || { echo "::error::$UBI9:$t serves $got, not $D"; exit 1; }
          done
          echo "digest_ubi9=$D" >> "$GITHUB_OUTPUT"
      - name: Refuse to sign an image an earlier run signed (docs/releasing.md, "When a release run fails")
        run: |
          # A re-run pushes the same digests (the build is reproducible). Signing them again adds
          # a second set of signatures to an image customers may already have, and the older
          # .sig among them breaks the offline tar. Only a run that signed nothing may run again.
          for d in ${{ steps.push.outputs.digest }} ${{ steps.push.outputs.digest_amd64 }} ${{ steps.push.outputs.digest_arm64 }}; do
            if packaging/ci/tool cosign verify --key /work/cosign.pub --insecure-ignore-tlog "$IMAGE@$d" > /dev/null 2>&1; then
              echo "::error::$IMAGE@$d is already signed by an earlier run: cut a new version"; exit 1
            fi
          done
          if packaging/ci/tool cosign verify --key /work/cosign.pub --insecure-ignore-tlog "$UBI9@${{ steps.push-ubi9.outputs.digest_ubi9 }}" > /dev/null 2>&1; then
            echo "::error::$UBI9 is already signed by an earlier run: cut a new version"; exit 1
          fi
          echo "not signed yet: ok"
      - name: Mirror the base images, their records and the runtime base's sources
        run: |
          O() { packaging/ci/tool oras copy --from-registry-config /auth/config.json --to-registry-config /auth/config.json "$@"; }
          f=base-evidence/froms.json; last=$(( $(jq length $f) - 1 ))
          for i in $(seq 0 $last); do
            name=$(jq -r ".[$i].name" $f); tag=$(jq -r ".[$i].tag" $f); digest=$(jq -r ".[$i].digest" $f)
            quay="quay.io/hummingbird/${name#registry.access.redhat.com/hi/}"
            O -r "$name@$digest" "$BASE_MIRROR:$tag-${digest:7:12}"
            children=$(jq -r '.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64")) | .digest' "base-evidence/index-$i.json")
            for d in "$digest" $children; do for s in att sbom sig; do
              O "$quay:sha256-${d#sha256:}.$s" "$BASE_MIRROR:sha256-${d#sha256:}.$s"
            done; done
          done
          name=$(jq -r ".[$last].name" $f)
          rel=$(jq -r '.config.Labels.release' "base-evidence/config-$last-amd64.json")
          O "$name:$rel-source" "$BASE_MIRROR:$rel-source"
      - name: Sign and attest the index and each platform image (our key, no public log)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          TOOL_ENV: COSIGN_PRIVATE_KEY COSIGN_PASSWORD
        run: |
          D=${{ steps.push.outputs.digest }}; CA=${{ steps.push.outputs.digest_amd64 }}; CR=${{ steps.push.outputs.digest_arm64 }}
          python3 packaging/release/provenance.py --wheel dist/*.whl --froms base-evidence/froms.json \
            --mirror "$BASE_MIRROR" --started "$(jq -rs 'map(.started) | min' build-info-*/build-info.json)" > provenance.json
          S() { packaging/ci/tool cosign "$@" --key env://COSIGN_PRIVATE_KEY \
                  --signing-config /work/packaging/release/signing-config.json --yes; }
          S sign --recursive "$IMAGE@$D"
          for d in "$D" "$CA" "$CR"; do
            S attest --type slsaprovenance1 --predicate /work/provenance.json "$IMAGE@$d"
            S attest --type "$ATT/base-image-record/v2" --predicate /work/base-evidence/base-image-record.json "$IMAGE@$d"
          done
          for a in amd64 arm64; do
            c=$CA; [ "$a" = arm64 ] && c=$CR
            S attest --type spdxjson --predicate "/work/sbom-$a/wd2l.spdx.json" "$IMAGE@$c"
            S attest --type "$ATT/vuln-scan/v1" --predicate "/work/vuln-$a/vuln-predicate.json" "$IMAGE@$c"
          done
          # The comparison image (#192): UBI 9 isn't mirrored, so its provenance names no mirror.
          DU=${{ steps.push-ubi9.outputs.digest_ubi9 }}
          python3 packaging/release/provenance.py --wheel dist/*.whl --froms base-evidence-ubi9/froms.json \
            --containerfile packaging/container/Containerfile.ubi9 \
            --started "$(jq -r .started build-info-ubi9-amd64/build-info.json)" > provenance-ubi9.json
          S sign "$UBI9@$DU"
          S attest --type slsaprovenance1 --predicate /work/provenance-ubi9.json "$UBI9@$DU"
          S attest --type "$ATT/base-image-record/v2" --predicate /work/base-evidence-ubi9/base-image-record-ubi9.json "$UBI9@$DU"
          S attest --type spdxjson --predicate /work/sbom-ubi9-amd64/wd2l.spdx.json "$UBI9@$DU"
          S attest --type "$ATT/vuln-scan/v1" --predicate /work/vuln-ubi9-amd64/vuln-predicate.json "$UBI9@$DU"
      - name: Save each platform's image with its signatures and attestations, for offline enclaves
        run: |
          # One tar per platform: cosign save keeps a platform image's signatures, not an index's.
          # Saved before the older-format signature below: cosign save would list that .sig as a
          # second image, and `skopeo copy oci:wd2l-oci` then stops ("more than one image").
          for a in amd64 arm64; do
            c=${{ steps.push.outputs.digest_amd64 }}; [ "$a" = arm64 ] && c=${{ steps.push.outputs.digest_arm64 }}
            mkdir -p "save-$a"
            packaging/ci/tool cosign save --dir "/work/save-$a/wd2l-oci" "$IMAGE@$c"
            tar -C "save-$a" -cf "wd2l-${{ steps.v.outputs.pep440 }}-image-$a-oci.tar" wd2l-oci
          done
          DU=${{ steps.push-ubi9.outputs.digest_ubi9 }}
          mkdir -p save-ubi9
          packaging/ci/tool cosign save --dir "/work/save-ubi9/wd2l-oci" "$UBI9@$DU"
          tar -C save-ubi9 -cf "wd2l-${{ steps.v.outputs.pep440 }}-image-ubi9-amd64-oci.tar" wd2l-oci
      - name: Older-format signature on each platform image, for Podman's signature policy
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          TOOL_ENV: COSIGN_PRIVATE_KEY COSIGN_PASSWORD
        run: |
          # Podman's sigstoreSigned policy reads only cosign's older .sig format
          # (docs/deployment/containers.md). The flags are deprecated; if a cosign update drops
          # them this step fails, and verify-published and import-check would catch a missing
          # signature.
          for c in ${{ steps.push.outputs.digest_amd64 }} ${{ steps.push.outputs.digest_arm64 }}; do
            packaging/ci/tool cosign sign --key env://COSIGN_PRIVATE_KEY \
              --new-bundle-format=false --use-signing-config=false --tlog-upload=false --yes "$IMAGE@$c"
          done
          packaging/ci/tool cosign sign --key env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false --use-signing-config=false --tlog-upload=false --yes \
            "$UBI9@${{ steps.push-ubi9.outputs.digest_ubi9 }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-release
          path: |
            wd2l-*-image-*-oci.tar
            provenance.json
            provenance-ubi9.json

  verify-published:
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      IMG: ghcr.io/joehazurmoney/wd2l
      D: ${{ needs.publish.outputs.digest }}
      CA: ${{ needs.publish.outputs.digest_amd64 }}
      CR: ${{ needs.publish.outputs.digest_arm64 }}
      UBI9: ghcr.io/joehazurmoney/wd2l-ubi9
      DU: ${{ needs.publish.outputs.digest_ubi9 }}
      ATT: https://github.com/JoeHazurmoney/architecture-wiredata-to-log/attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-release
      - env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Verify as a consumer would, online and then with no network, both platforms
        run: |
          V() { packaging/ci/tool cosign "$@" --key /work/cosign.pub --insecure-ignore-tlog > /dev/null; }
          CHILD="slsaprovenance1 spdxjson $ATT/vuln-scan/v1 $ATT/base-image-record/v2"
          V verify "$IMG@$D" && echo "index signature: ok"
          for t in slsaprovenance1 "$ATT/base-image-record/v2"; do V verify-attestation --type "$t" "$IMG@$D" && echo "index $t: ok"; done
          for c in "$CA" "$CR"; do
            V verify "$IMG@$c" && echo "$c signature: ok"
            # The older .sig that Podman's policy reads; with this flag cosign reads only that.
            V verify --new-bundle-format=false "$IMG@$c" && echo "$c older-format signature: ok"
            for t in $CHILD; do V verify-attestation --type "$t" "$IMG@$c" && echo "$c $t: ok"; done
          done
          packaging/ci/tool cosign tree "$IMG@$D"
          # The comparison image (#192): one platform image, verified the same way.
          V verify "$UBI9@$DU" && echo "ubi9 signature: ok"
          V verify --new-bundle-format=false "$UBI9@$DU" && echo "ubi9 older-format signature: ok"
          for t in $CHILD; do V verify-attestation --type "$t" "$UBI9@$DU" && echo "ubi9 $t: ok"; done
          export TOOL_NETWORK=none
          for a in amd64 arm64; do
            mkdir -p "off-$a" && tar -xf wd2l-*-image-$a-oci.tar -C "off-$a"
            V verify --local-image "/work/off-$a/wd2l-oci" && echo "$a offline signature: ok"
            for t in $CHILD; do V verify-attestation --type "$t" --local-image "/work/off-$a/wd2l-oci" && echo "$a offline $t: ok"; done
          done
          mkdir -p off-ubi9 && tar -xf wd2l-*-image-ubi9-amd64-oci.tar -C off-ubi9
          V verify --local-image /work/off-ubi9/wd2l-oci && echo "ubi9 offline signature: ok"
          for t in $CHILD; do V verify-attestation --type "$t" --local-image /work/off-ubi9/wd2l-oci && echo "ubi9 offline $t: ok"; done

  import-check:
    # What a host does with the release: import its platform's tar offline, and pull from the
    # registry under Podman's signature policy (docs/deployment/containers.md).
    needs: [publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04, uname: x86_64}
          - {arch: arm64, runner: ubuntu-24.04-arm, uname: aarch64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      IMG: ghcr.io/joehazurmoney/wd2l
      D: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-release
      - name: Offline import picks this host's platform
        run: |
          [ "$(uname -m)" = "${{ matrix.uname }}" ]
          tar -xf wd2l-*-image-${{ matrix.arch }}-oci.tar
          sudo skopeo copy -q oci:wd2l-oci "containers-storage:$IMG:import-check"
          got=$(sudo podman image inspect --format '{{.Architecture}}' "$IMG:import-check")
          [ "$got" = "${{ matrix.arch }}" ] || { echo "imported $got" >&2; exit 1; }
          for c in wd2l-sender wd2l-receiver wd2l-audit-report; do
            sudo podman run --rm --pull=never "$IMG:import-check" "$c" --help > /dev/null
          done
      - name: Podman's signature policy accepts the published image
        run: |
          mkdir -p regd
          printf 'docker:\n  ghcr.io/joehazurmoney:\n    use-sigstore-attachments: true\n' > regd/ghcr.yaml
          jq -n --arg k "$PWD/cosign.pub" '{default: [{type: "reject"}],
            transports: {docker: {"ghcr.io/joehazurmoney/wd2l": [{type: "sigstoreSigned", keyPath: $k,
              signedIdentity: {type: "matchRepository"}}]}, oci: {"": [{type: "insecureAcceptAnything"}]}}}' > policy.json
          skopeo copy -q --remove-signatures --policy policy.json --registries.d regd "docker://$IMG@$D" oci:policy-check
          echo "policy: accepted ($(uname -m))"
      - name: The comparison image (UBI 9) imports offline and passes Podman's signature policy
        if: ${{ matrix.arch == 'amd64' }}
        env:
          U: ghcr.io/joehazurmoney/wd2l-ubi9
          DU: ${{ needs.publish.outputs.digest_ubi9 }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ubi9 && tar -xf wd2l-*-image-ubi9-amd64-oci.tar -C ubi9
          sudo skopeo copy -q oci:ubi9/wd2l-oci "containers-storage:$U:import-check"
          for c in wd2l-sender wd2l-receiver wd2l-audit-report; do
            sudo podman run --rm --pull=never "$U:import-check" "$c" --help > /dev/null
          done
          # A new package starts private (docs/releasing.md): read it with this run's token.
          printf '%s' "$REGISTRY_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          jq -n --arg k "$PWD/cosign.pub" '{default: [{type: "reject"}],
            transports: {docker: {"ghcr.io/joehazurmoney/wd2l-ubi9": [{type: "sigstoreSigned", keyPath: $k,
              signedIdentity: {type: "matchRepository"}}]}, oci: {"": [{type: "insecureAcceptAnything"}]}}}' > policy-ubi9.json
          skopeo copy -q --remove-signatures --policy policy-ubi9.json --registries.d regd "docker://$U@$DU" oci:policy-check-ubi9
          echo "policy: accepted (wd2l-ubi9)"
