name: release
# A version tag (vX.Y.Z or vX.Y.ZrcN) builds, checks, signs and publishes everything, then makes
# a DRAFT GitHub release for a person to review and publish (docs/releasing.md).
# Anything else is a dry run: the same builds and checks, nothing pushed, signed or released.
# Dry runs start from workflow_dispatch (once this file is on the default branch), or from a
# branch push that changes this file.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths: [".github/workflows/release.yml"]   # not evaluated for tags
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  REAL: ${{ startsWith(github.ref, 'refs/tags/v') }}
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      pep440: ${{ steps.v.outputs.pep440 }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # origin/main, for the check below
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 packaging/release/versions.py --github-output "$GITHUB_OUTPUT"
          if [ "$REAL" = true ]; then
            python3 packaging/release/versions.py --check-tag "$TAG"
            # Only a commit already merged to main is released (docs/releasing.md).
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || { echo "tag $TAG is not on main: release from main only" >&2; exit 1; }
          fi

  tests:
    needs: [version]
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read
      security-events: write    # tests.yml's code-scanning job asks for it (it runs on main only)
    with:
      image: false

  image:
    needs: [version]
    uses: ./.github/workflows/image.yml

  rpm:
    needs: [image]
    uses: ./.github/workflows/rpm.yml

  publish:
    # Only for a tag; publish.yml also verifies what it pushed, online and offline.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [version, tests, image, rpm]
    uses: ./.github/workflows/publish.yml
    # publish.yml's job runs in the `release` environment, whose secrets it then reads;
    # repository secrets come through inherit until they move there (docs/releasing.md).
    secrets: inherit
    permissions:
      contents: read
      packages: write

  assets:
    # The release files and SHA256SUMS, made once, for attest and release. No secrets and no
    # OIDC token here. publish is skipped on a dry run; on a tag it must have succeeded.
    if: >-
      ${{ !cancelled() && needs.tests.result == 'success' && needs.image.result == 'success'
      && needs.rpm.result == 'success'
      && (needs.publish.result == 'success'
          || (needs.publish.result == 'skipped' && !startsWith(github.ref, 'refs/tags/v'))) }}
    needs: [version, tests, image, rpm, publish]
    runs-on: ubuntu-24.04
    env:
      V: ${{ needs.version.outputs.pep440 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{dist,rpms-el9,rpms-el10,sbom-amd64,sbom-arm64,base-evidence,vuln-amd64,vuln-arm64,image-release}"
      - name: Assemble the assets
        run: |
          mkdir assets
          cp "dist/wd2l-$V-py3-none-any.whl" "dist/wd2l-$V.tar.gz" assets/
          cp rpms-el9/rel1/*.rpm rpms-el10/rel1/*.rpm assets/
          for a in amd64 arm64; do
            cp "sbom-$a/wd2l.spdx.json" "assets/wd2l-$V-image-$a.spdx.json"
            cp "sbom-$a/wd2l.cdx.json" "assets/wd2l-$V-image-$a.cdx.json"
            cp "vuln-$a/vuln-summary.md" "assets/wd2l-$V-vuln-summary-$a.md"
          done
          cp base-evidence/base-image-record.json assets/
          if [ -f cosign.pub ]; then
            cp cosign.pub assets/
          elif [ "$REAL" = true ]; then
            echo "cosign.pub is missing (docs/releasing.md, one-time setup)" >&2; exit 1
          fi
          if [ -d image-release ]; then
            cp "image-release/wd2l-$V-image-"*-oci.tar assets/
            cp image-release/provenance.json "assets/wd2l-$V-provenance.json"
          fi
          # GitHub serves an asset whose name has "~" under a name with "." instead: name the
          # files that way first, so SHA256SUMS lists what a download gets. Only pre-release
          # RPMs have one (X.Y.Z~rcN); the package inside keeps its version.
          for f in assets/*~*; do if [ -e "$f" ]; then mv -- "$f" "${f//\~/.}"; fi; done
          (cd assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets
          path: assets/

  attest:
    # SLSA Build L3 provenance and the keyless signature (docs/decisions/0007-slsa-build-l3.md):
    # only attest.yml gets an OIDC token, and only for a tag.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [publish, assets]
    uses: ./.github/workflows/attest.yml
    with:
      image-digest: ${{ needs.publish.outputs.digest }}
      image-digest-amd64: ${{ needs.publish.outputs.digest_amd64 }}
      image-digest-arm64: ${{ needs.publish.outputs.digest_arm64 }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write

  release:
    # attest is skipped on a dry run; on a tag it must have succeeded.
    if: >-
      ${{ !cancelled() && needs.assets.result == 'success'
      && (needs.attest.result == 'success'
          || (needs.attest.result == 'skipped' && !startsWith(github.ref, 'refs/tags/v'))) }}
    needs: [version, publish, assets, attest]
    runs-on: ubuntu-24.04
    # The signing secrets and the approval gate live in the `release` environment, which only a
    # v* tag may use; a dry run needs neither.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: write
    env:
      V: ${{ needs.version.outputs.pep440 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: assets
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.attest.result == 'success' }}
        with:
          name: attestations
          path: attestations
      - name: Sign SHA256SUMS (our key, no public log)
        if: ${{ env.REAL == 'true' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          TOOL_ENV: COSIGN_PRIVATE_KEY COSIGN_PASSWORD
        run: |
          packaging/ci/tool cosign sign-blob --key env://COSIGN_PRIVATE_KEY \
            --signing-config /work/packaging/release/signing-config.json --yes \
            --bundle /work/assets/SHA256SUMS.sigstore.json /work/assets/SHA256SUMS
          TOOL_NETWORK=none packaging/ci/tool cosign verify-blob --key /work/cosign.pub \
            --insecure-ignore-tlog --bundle /work/assets/SHA256SUMS.sigstore.json /work/assets/SHA256SUMS
      - name: Attach the GitHub attestations (one bundle per line)
        if: ${{ needs.attest.result == 'success' }}
        run: cp attestations/attestations.jsonl "assets/wd2l-$V-attestations.jsonl"
      - name: Notes
        run: |
          python3 packaging/release/notes.py --image-digest "${{ needs.publish.outputs.digest }}" \
            --platform-digest amd64=${{ needs.publish.outputs.digest_amd64 }} \
            --platform-digest arm64=${{ needs.publish.outputs.digest_arm64 }} \
            --sums assets/SHA256SUMS --base-record assets/base-image-record.json \
            --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --commit "$GITHUB_SHA" > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Draft release (a person reviews and publishes it)
        if: ${{ env.REAL == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pre=(); [ "${{ needs.version.outputs.prerelease }}" != true ] || pre=(--prerelease)
          gh release create "${{ needs.version.outputs.tag }}" --draft --verify-tag \
            --title "wd2l $V" --notes-file notes.md "${pre[@]}" assets/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            assets/
            notes.md
