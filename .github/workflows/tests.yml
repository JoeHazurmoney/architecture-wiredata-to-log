name: tests

on:
  push:
    # main only: a PR's commits run once, from pull_request (#116). A version tag runs
    # release.yml, which calls this workflow itself.
    branches: [main]
  pull_request:
  # A branch with no PR: gh workflow run tests.yml --ref BRANCH
  workflow_dispatch:
  workflow_call:
    inputs:
      image:
        description: also run the image pipeline and the RPMs (release.yml runs them itself)
        type: boolean
        default: true

concurrency:
  # A newer commit on a PR cancels its older run. Any other run gets a group of its own and is
  # never cancelled: main, a manual run, and a call from release.yml (whose event it reports).
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  changes:
    # Whether a pull request changes only files under docs/ (#244). Nothing there reaches the lab,
    # the image or the RPMs, so they're skipped; pytest still runs, because its tests read the
    # docs. README.md isn't docs-only: the wheel, the sdist and the RPM carry it. Every other
    # event, release.yml's call included, runs everything.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          docs_only=false
          if [ "$EVENT" = pull_request ]; then
            # The checkout is the pull request merged into its base: its first parent is the base.
            git diff --name-only HEAD^1 HEAD | tee changed.txt
            if [ -s changed.txt ] && ! grep -qv '^docs/' changed.txt; then docs_only=true; fi
          fi
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"

  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        # 3.9 is the oldest version the package supports (pyproject.toml).
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # The test runner and the release manifest's schema validator, both hash-pinned. pytest 9
      # needs Python 3.10, so the floor's leg has its own pins (#139).
      - run: python -m pip install --require-hashes -r "$TEST_REQS" -r packaging/release/requirements.txt
        env:
          TEST_REQS: ${{ matrix.python-version == '3.9' && 'packaging/ci-py39/test-requirements.txt' || 'packaging/ci/test-requirements.txt' }}
      - run: python -m pytest -q
        env:
          WD2L_NO_SKIPS: "1"        # a skipped test fails the run (tests/conftest.py)
      - name: Byte-compile everything (catches syntax the oldest Python can't read)
        run: python -m compileall -q wd2l lab tests packaging

  lab:
    # The full one-way path in network namespaces, including loss, outage and crash runs.
    needs: [changes]
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30        # it takes about 11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update -q && sudo apt-get install -y -q iproute2 nftables tcpdump ethtool
      - run: sudo lab/check-nic-scripts.sh
      - run: sudo lab/run-lab.sh
      - run: sudo lab/run-lab.sh --loss 1
      - run: sudo lab/run-lab.sh --receiver-outage
      - run: sudo lab/run-lab.sh --receiver-crash
      - run: sudo lab/run-lab.sh --maintenance
      - run: sudo lab/run-lab.sh --fault aggregator-stop
      - run: sudo lab/run-lab.sh --fault sender-stop
      - run: sudo lab/run-lab.sh --fault sender-hang
      - run: sudo lab/run-lab.sh --fault tap-down
      - run: sudo lab/run-lab.sh --fault foreign-only
      - run: sudo lab/run-lab.sh --fault wire-loss
      - run: sudo lab/run-lab.sh --fault receiver-slow
      - run: sudo lab/run-lab.sh --fault siem-down
      - run: sudo lab/run-lab.sh --fault clock
      - run: sudo lab/run-lab.sh --chrony-udp
      - name: --chrony-addr against a real chronyd, not the lab's stand-in
        run: podman run --rm -v "$PWD:/src:ro" "$(packaging/ci/tool --ref alma10)" bash /src/packaging/ci/chrony-smoke.sh
      - name: The key-generation command in docs/releasing.md works (a throwaway key)
        run: |
          COSIGN_PASSWORD=throwaway TOOL_ENV=COSIGN_PASSWORD \
            packaging/ci/tool cosign generate-key-pair --output-key-prefix ci-throwaway
          test -s ci-throwaway.key && test -s ci-throwaway.pub && rm ci-throwaway.key ci-throwaway.pub
      - run: sudo lab/run-lab.sh --fault clock --chrony-udp
      - run: sudo lab/run-lab.sh --files samples/logs/messages samples/logs/secure samples/logs/audit.log
      - run: sudo lab/run-lab.sh --interleave --files samples/logs/messages samples/logs/secure samples/logs/audit.log

  image:
    # The container image's checks (.github/workflows/image.yml); nothing is published.
    # format(): on push, PR and workflow_dispatch there are no inputs, and in expressions
    # null == false. A docs-only pull request skips it (the changes job).
    needs: [changes]
    if: ${{ format('{0}', inputs.image) != 'false' && needs.changes.outputs.docs_only != 'true' }}
    uses: ./.github/workflows/image.yml

  rpm:
    # The RPMs, from the dist artifact the image job's build made. release.yml calls tests.yml
    # with image: false and calls rpm.yml itself. Skipped with the image on a docs-only PR.
    if: ${{ format('{0}', inputs.image) != 'false' && needs.changes.outputs.docs_only != 'true' }}
    needs: [changes, image]
    uses: ./.github/workflows/rpm.yml

  code-scanning:
    # Grype's and Trivy's findings in Security > Code scanning, from main only: alerts are tracked
    # against the default branch, and a fork PR's token can't upload. !cancelled(): also when
    # another image check failed, uploading whichever platform's results exist (#175).
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # By pattern: whichever of vuln-amd64 and vuln-arm64 exist, each in its own directory.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vuln-*
      # amd64 keeps the original categories, so its alert history carries on.
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ hashFiles('vuln-amd64/grype.sarif') != '' }}
        with:
          sarif_file: vuln-amd64/grype.sarif
          category: grype-image
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ hashFiles('vuln-amd64/trivy.sarif') != '' }}
        with:
          sarif_file: vuln-amd64/trivy.sarif
          category: trivy-image
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ hashFiles('vuln-arm64/grype.sarif') != '' }}
        with:
          sarif_file: vuln-arm64/grype.sarif
          category: grype-image-arm64
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ hashFiles('vuln-arm64/trivy.sarif') != '' }}
        with:
          sarif_file: vuln-arm64/trivy.sarif
          category: trivy-image-arm64

  landed-title:
    # The commit convention on what landed (docs/releasing.md, "Conventions"): pr-title.yml
    # checked the title, but it can be edited after that check. Warns, never fails, and isn't
    # in ci-ok: a red main for a wording slip would teach people to ignore red.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git log -1 --format=%s | python3 packaging/ci/check_title.py --warn

  signing-key-scope:
    # The signing key belongs in the `release` environment only (docs/releasing.md, one-time
    # setup). This job names no environment, so secrets.* here holds only repository and
    # organization secrets: the key showing up means any branch's workflow can read it. Only
    # the comparison's result is used, never the value. On main only, like landed-title.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          REPO_KEY: ${{ secrets.COSIGN_PRIVATE_KEY != '' }}
        run: |
          [ "$REPO_KEY" = false ] || {
            echo "COSIGN_PRIVATE_KEY is a repository secret: delete it there, keep the release environment's (docs/releasing.md)" >&2
            exit 1
          }

  ci-ok:
    # The one check main's ruleset requires: every job above passed, or was skipped by design
    # (release.yml calls this workflow with image: false; a docs-only PR skips three). It needs
    # changes too, so a failed changes job can't skip the rest and still pass.
    if: ${{ always() }}
    needs: [changes, pytest, lab, image, rpm]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null
