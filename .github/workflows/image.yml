name: image
# The container image's checks (docs/decisions/0004-container-base-image.md): every PR and every
# push to main via tests.yml, and every release via release.yml, which then runs publish.yml. The
# image is built for linux/amd64 and linux/arm64, each natively on its own runner, and every check
# runs for both.
on:
  workflow_call:
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every FROM pinned, a Hardened Image, a FIPS variant
        run: python3 packaging/container/check_containerfile.py
      - name: hadolint
        run: packaging/ci/tool hadolint /bin/hadolint /work/packaging/container/Containerfile
      - name: trivy config (High and Critical), on the shipped Containerfile
        run: packaging/ci/tool trivy config --quiet --exit-code 1 --severity HIGH,CRITICAL /work/packaging/container/Containerfile

  base-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect each base image's signature, provenance, index, and each platform's config and SBOM
        run: |
          mkdir -p evidence
          python3 packaging/container/check_containerfile.py --json > evidence/froms.json
          for i in $(seq 0 $(( $(jq length evidence/froms.json) - 1 ))); do
            name=$(jq -r ".[$i].name" evidence/froms.json)
            digest=$(jq -r ".[$i].digest" evidence/froms.json)
            mirror="quay.io/hummingbird/${name#registry.access.redhat.com/hi/}"
            skopeo inspect --raw "docker://$name@$digest" > "evidence/index-$i.json"
            for arch in amd64 arm64; do
              skopeo inspect --config --override-os linux --override-arch $arch \
                "docker://$name@$digest" > "evidence/config-$i-$arch.json"
              child=$(jq -r --arg a $arch '.manifests[] | select(.platform.architecture == $a) | .digest' "evidence/index-$i.json")
              layer=$(packaging/ci/tool oras manifest fetch "$mirror:sha256-${child#sha256:}.sbom" | jq -r '.layers[0].digest')
              packaging/ci/tool oras blob fetch --output "/work/evidence/sbom-$i-$arch.spdx.json" "$mirror@$layer"
            done
            packaging/ci/tool cosign verify --key /work/packaging/container/keys/redhat-release3.pub \
              --insecure-ignore-tlog "$name@$digest" > "evidence/signature-$i.json"
            packaging/ci/tool cosign verify-attestation --key /work/packaging/container/keys/hummingbird-ci.pub \
              --insecure-ignore-tlog --type slsaprovenance "$mirror@$digest" > "evidence/provenance-$i.json"
          done
      - name: Cross-check and record
        run: python3 packaging/container/base_record.py --evidence evidence --out evidence/base-image-record.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: base-evidence
          path: evidence/

  wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Wheel and sdist (hash-pinned tools; BUILD = the commit; file times = the commit's)
        run: |
          packaging/build-dist.sh dist
          python packaging/check_dist.py dist --commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  build:
    needs: [wheel, lint, base-verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Image (native, so each runner builds its own platform)
        run: |
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          packaging/container/build.sh dist localhost/wd2l:ci
          got=$(podman image inspect --format '{{.Architecture}}' localhost/wd2l:ci)
          [ "$got" = "${{ matrix.arch }}" ] || { echo "built $got on the ${{ matrix.arch }} runner" >&2; exit 1; }
          mkdir -p image build-info
          podman save --format oci-archive -o image/image.oci.tar localhost/wd2l:ci
          jq -n --arg commit "$(git rev-parse HEAD)" \
                --arg version "$(python3 packaging/release/versions.py --get pep440)" \
                --arg arch "${{ matrix.arch }}" \
                --arg image_id "$(podman image inspect --format '{{.Id}}' localhost/wd2l:ci)" \
                --arg epoch "$(git log -1 --format=%ct)" --arg started "$started" \
                '{commit: $commit, version: $version, arch: $arch, image_id: $image_id, epoch: $epoch, started: $started}' \
                > build-info/build-info.json
          cat build-info/build-info.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: image/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-info-${{ matrix.arch }}
          path: build-info/

  reproducible:
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.arch }}
          path: image
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-info-${{ matrix.arch }}
          path: build-info
      - name: Rebuild the wheel, the sdist and the image from the same commit, on a fresh runner
        run: |
          # The same script as the wheel job, so a difference is the build's, not the steps'.
          # Any difference fails the run; the image is compared too, to show what differs.
          rc=0
          packaging/build-dist.sh dist2
          python packaging/check_dist.py dist2 --commit "$(git rev-parse HEAD)" --same-as dist || rc=1
          packaging/container/build.sh dist localhost/wd2l:again
          want=$(jq -r .image_id build-info/build-info.json)
          got=$(podman image inspect --format '{{.Id}}' localhost/wd2l:again)
          echo "first build $want"; echo "rebuild     $got"
          if [ "$want" = "$got" ]; then echo "image: identical"; exit $rc; fi
          first=$(podman load -q -i image/image.oci.tar | awk '{print $NF}')
          for i in "$first" localhost/wd2l:again; do
            c=$(podman create -q "$i")
            podman export "$c" | tar -tv --full-time | sort -k6 > "list-$(echo "$i" | tr -c 'a-z0-9\n' _).txt"
            podman rm -f "$c" > /dev/null
          done
          diff <(podman image inspect "$first" | jq '.[0] | {Config, RootFS, Created}') \
               <(podman image inspect localhost/wd2l:again | jq '.[0] | {Config, RootFS, Created}') || true
          diff list-*.txt || true
          exit 1

  hardening:
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.arch }}
          path: image
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-info-${{ matrix.arch }}
          path: build-info
      - name: Filesystem and config
        run: |
          IMG=$(podman load -q -i image/image.oci.tar | awk '{print $NF}')
          BASE=$(python3 packaging/container/check_containerfile.py --base)
          podman pull -q "$BASE"
          podman image inspect "$IMG" > inspect.json
          COMMIT=$(jq -r .commit build-info/build-info.json); VERSION=$(jq -r .version build-info/build-info.json)
          podman unshare bash -c 'set -e
            R=$(podman image mount "$1"); B=$(podman image mount "$2")
            python3 packaging/container/check_image.py --rootfs "$R" --base-rootfs "$B" \
              --config inspect.json --wheel dist/*.whl --commit "$3" --version "$4" --base-ref "$2"' \
            _ "$IMG" "$BASE" "$COMMIT" "$VERSION"
          echo "IMG=$IMG" >> "$GITHUB_ENV"
      - name: FIPS in force at run time
        run: podman run --rm -v "$PWD/packaging/container/fips_check.py:/fips_check.py:ro" "$IMG" python3 /fips_check.py

  vuln-scan:
    # Reads the image archive only, so both platforms are scanned on the amd64 runner.
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64}
          - {arch: arm64}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.arch }}
          path: image
      - name: Grype and Trivy
        run: |
          mkdir -p vuln .cache
          packaging/ci/tool grype oci-archive:/work/image/image.oci.tar -q \
            -o json=/work/vuln/grype.json -o sarif=/work/vuln/grype.sarif
          # Trivy reads an OCI directory (or a docker archive), not an OCI archive tar.
          mkdir -p image/oci && tar -xf image/image.oci.tar -C image/oci
          packaging/ci/tool trivy image --quiet --cache-dir /work/.cache/trivy --input /work/image/oci \
            --scanners vuln,secret --format json --output /work/vuln/trivy.json
          packaging/ci/tool trivy convert --format sarif --output /work/vuln/trivy.sarif /work/vuln/trivy.json
      - name: Record the findings, and whether they need a security review (fixable High/Critical, or a secret)
        run: |
          # Findings never fail the build (#175): vuln-review and security-review decide.
          python3 packaging/container/vuln_gate.py --grype vuln/grype.json --trivy vuln/trivy.json \
            --exceptions packaging/container/vuln-exceptions.json \
            --summary vuln/vuln-summary.md --predicate vuln/vuln-predicate.json > /dev/null
          { echo "### ${{ matrix.arch }}"; cat vuln/vuln-summary.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vuln-${{ matrix.arch }}
          path: vuln/

  vuln-review:
    # Whether either platform's findings need a security review: a fixable High or Critical, or
    # a secret, that no unexpired exception covers, or an exception that has expired.
    needs: [vuln-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.decide.outputs.needed }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vuln-*
      - id: decide
        run: |
          needed=$(jq -s 'map(.gate.review_needed) | any' vuln-amd64/vuln-predicate.json vuln-arm64/vuln-predicate.json)
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "security review needed: $needed"

  security-review:
    # The pause (docs/releasing.md, "Security review"): on a pull request or a release, a finding
    # that needs review waits here until the security-review environment's required reviewer
    # approves. Rejecting fails the run. A push to main records its findings without pausing:
    # its pull request was reviewed. Everything after the image waits: ci-ok, the RPMs, publish.
    needs: [vuln-review]
    if: ${{ needs.vuln-review.outputs.needed == 'true' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: security-review
    steps:
      - run: echo "Approved after review. The findings are in this run's summary and its vuln-* artifacts."

  sbom:
    # Reads the image archives only: both platforms on the amd64 runner.
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64}
          - {arch: arm64}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.arch }}
          path: image
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: SBOMs of the image (every file, named as published) and of its base (the same platform)
        env:
          SYFT_FILE_METADATA_SELECTION: all
        run: |
          mkdir -p sbom
          WHEEL=$(ls dist/wd2l-*-py3-none-any.whl); V=${WHEEL#dist/wd2l-}; V=${V%-py3-none-any.whl}
          echo "WHEEL=$WHEEL" >> "$GITHUB_ENV"
          TOOL_ENV=SYFT_FILE_METADATA_SELECTION packaging/ci/tool syft oci-archive:/work/image/image.oci.tar -q \
            --source-name ghcr.io/joehazurmoney/wd2l --source-version "$V" \
            -o spdx-json=/work/sbom/wd2l.spdx.json -o cyclonedx-json=/work/sbom/wd2l.cdx.json
          BASE=$(python3 packaging/container/check_containerfile.py --base)
          podman pull -q --arch ${{ matrix.arch }} "$BASE" && podman save -q --format oci-archive -o base.oci.tar "$BASE"
          packaging/ci/tool syft oci-archive:/work/base.oci.tar -q -o spdx-json=/work/sbom/base.spdx.json
      - name: Complete the image's SBOMs (docs/decisions/0009-sbom-content.md); a gap fails the run
        run: |
          python3 packaging/container/sbom_enrich.py --spdx sbom/wd2l.spdx.json --cdx sbom/wd2l.cdx.json --wheel "$WHEEL" --arch ${{ matrix.arch }} \
            --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
      - run: python3 packaging/container/sbom_diff.py sbom/base.spdx.json sbom/wd2l.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.arch }}
          path: sbom/

  functional:
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04, uname: x86_64}
          - {arch: arm64, runner: ubuntu-24.04-arm, uname: aarch64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.arch }}
          path: image
      - run: sudo apt-get update -q && sudo apt-get install -y -q iproute2 nftables tcpdump
      - name: Load (on its own platform, never emulated)
        run: |
          [ "$(uname -m)" = "${{ matrix.uname }}" ]
          IMG=$(sudo podman load -q -i image/image.oci.tar | awk '{print $NF}')
          [ "$(sudo podman image inspect --format '{{.Architecture}}' "$IMG")" = "${{ matrix.arch }}" ]
          echo "IMG=$IMG" >> "$GITHUB_ENV"
      - name: Smoke
        run: |
          for c in wd2l-sender wd2l-receiver wd2l-audit-report; do sudo podman run --rm "$IMG" "$c" --help > /dev/null; done
          if sudo podman run --rm "$IMG" python3 -m wd2l.audit verify /tmp; then exit 1; fi
          echo "an empty audit directory is refused, as expected"
      - run: sudo lab/run-lab.sh --image "$IMG"
      - run: sudo lab/run-lab.sh --image "$IMG" --loss 1
      - run: sudo lab/run-lab.sh --image "$IMG" --maintenance
      - run: sudo lab/run-lab.sh --image "$IMG" --receiver-outage
      - run: sudo lab/run-lab.sh --image "$IMG" --files samples/logs/messages samples/logs/secure samples/logs/audit.log

  fips-tests:
    # The whole test suite under the OpenSSL FIPS provider (the builder has the same Python and
    # crypto policy as the runtime image, plus a shell and dnf for pytest), on each platform.
    # No test may skip (WD2L_NO_SKIPS): git, which the release-tool tests need and the builder
    # lacks, is added in a throwaway image that ends as the builder's own user.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          B=$(python3 packaging/container/check_containerfile.py --json | jq -r '.[] | select(.tag | endswith("-builder")) | .ref')
          printf 'FROM %s\nUSER 0\nRUN dnf -y -q install git-core && dnf clean all\nUSER 65532\n' "$B" \
            | podman build -q -t localhost/fips-tests -f - "$(mktemp -d)"
          podman run --rm --userns=keep-id -e WD2L_NO_SKIPS=1 -v "$PWD:/src" -w /src localhost/fips-tests bash -c \
            'python3 -c "import _hashlib; assert _hashlib.get_fips_mode() == 1, \"not FIPS\"" &&
             python3 -m pip install -q --user --require-hashes -r packaging/ci/test-requirements.txt -r packaging/release/requirements.txt &&
             python3 -m pytest -q -p no:cacheprovider'
