name: image-rescan
# Re-scans the released images, both platforms, with today's vulnerability data, monthly: a CVE disclosed after a
# release that needs a security review opens an issue (docs/decisions/0004-container-base-image.md,
# docs/releasing.md). Only the latest and the previous final release (#240). pin-check.yml checks the pins weekly.
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:
concurrency:
  # One run at a time: two could both find no open issue and file the same one twice.
  group: image-rescan
  cancel-in-progress: false
defaults:
  run:
    shell: bash
permissions:
  contents: read
  packages: read
  issues: write
jobs:
  rescan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GRYPE_DB_CACHE_DIR: /work/.cache/grype
      TOOL_ENV: GRYPE_DB_CACHE_DIR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Scan the latest and the previous release
        run: |
          mkdir -p .cache
          gh release list --limit 2 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' > tags.txt
          mapfile -t tags < tags.txt
          # Newest first, so the latest release is scanned before the ones it replaced (#239).
          latest=${tags[0]#v}
          for tag in "${tags[@]}"; do
            v=${tag#v}
            # What shipped, by the digest its manifest records: a tag can move (#177). Every final
            # release from 1.0.0 has one.
            gh release download "$tag" -p "wd2l-$v-release-manifest.json" -O "manifest-$v.json"
            d=$(jq -r '.image.index_digest // empty' "manifest-$v.json")
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::$tag's manifest names no image digest"; exit 1; }
            ref="ghcr.io/joehazurmoney/wd2l@$d"
            for a in amd64 arm64; do
              packaging/ci/tool grype "registry:$ref" --platform "linux/$a" -o json --file "/work/grype-$v-$a.json" 2>&1 | tee "grype-$v-$a.log"
              packaging/ci/tool trivy image --platform "linux/$a" --cache-dir /work/.cache/trivy --scanners vuln,secret \
                --format json --output "/work/trivy-$v-$a.json" "$ref" 2>&1 | tee "trivy-$v-$a.log"
              # Findings don't fail the run (#175): one that needs a review (exit 3) opens its
              # issue, or comments on the open one. Any other exit is the gate itself failing.
              # An older release's finding that the latest doesn't have is reported as fixed
              # there, and opens no issue (#239).
              latest_args=()
              [ "$v" = "$latest" ] || latest_args=(--latest-grype "grype-$latest-$a.json" --latest-trivy "trivy-$latest-$a.json" --latest "$latest")
              rc=0
              python3 packaging/container/vuln_gate.py --grype "grype-$v-$a.json" --trivy "trivy-$v-$a.json" "${latest_args[@]}" \
                --exceptions packaging/container/vuln-exceptions.json --summary "summary-$v-$a.md" --warnings "coverage-$v-$a.log" --exit-code 3 || rc=$?
              [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ] || exit "$rc"
              if [ "$rc" -eq 3 ]; then
                title="Image rescan: wd2l $v ($a) needs a security review"
                n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
                if [ -n "$n" ]; then gh issue comment "$n" --body-file "summary-$v-$a.md"
                else gh issue create --title "$title" --label security --label bug --body-file "summary-$v-$a.md"; fi
              fi
              { echo "## wd2l $v ($a)"; cat "summary-$v-$a.md"; } >> "$GITHUB_STEP_SUMMARY"
            done
            # The comparison image on UBI 9 (#192), from 1.2.0: reported, never an issue.
            d9=$(jq -r '.comparison_image.digest // empty' "manifest-$v.json")
            if [ -n "$d9" ]; then
              packaging/ci/tool grype "registry:ghcr.io/joehazurmoney/wd2l-ubi9@$d9" --platform linux/amd64 -o json --file "/work/grype-ubi9-$v.json" 2>&1 | tee "grype-ubi9-$v.log"
              packaging/ci/tool trivy image --platform linux/amd64 --cache-dir /work/.cache/trivy --scanners vuln,secret \
                --format json --output "/work/trivy-ubi9-$v.json" "ghcr.io/joehazurmoney/wd2l-ubi9@$d9" 2>&1 | tee "trivy-ubi9-$v.log"
              python3 packaging/container/vuln_gate.py --grype "grype-ubi9-$v.json" --trivy "trivy-ubi9-$v.json" \
                --exceptions packaging/container/vuln-exceptions.json --summary "summary-ubi9-$v.md" --warnings "coverage-ubi9-$v.log"
              { echo "## wd2l-ubi9 $v (amd64), the comparison image: reported, never an issue"; cat "summary-ubi9-$v.md"; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Every warning the scanners logged, and each scanner without data for the OS (ADR-0011)
        if: ${{ !cancelled() }}
        run: |
          # Raised on the run, never failing it, unless packaging/container/tool-warnings.json expects it.
          shopt -s nullglob
          args=()
          for f in grype-*.log; do args+=(--log "grype=$f"); done
          for f in trivy-*.log; do args+=(--log "trivy=$f"); done
          for f in coverage-*.log; do args+=(--log "vuln-gate=$f"); done
          python3 packaging/container/tool_warnings.py --known packaging/container/tool-warnings.json \
            "${args[@]}" --summary tool-warnings.md
          cat tool-warnings.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: rescan
          path: |
            *.log
            *.md
            grype-*.json
            trivy-*.json
