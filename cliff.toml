# git-cliff's configuration: the changelog in every release, wd2l-<version>-changelog.md
# (docs/releasing.md, "Conventions"; docs/decisions/0008-release-manifest.md). It reads only the
# commit text, never a forge's API, so it renders offline from the release's source bundle.
# The groups follow the commit convention's types (packaging/ci/check_title.py); a test keeps
# the two in step. Commits from before the convention are grouped by pattern, not rejected.

[changelog]
header = """
# Changelog

Generated by git-cliff from the commits on `main`, grouped by type.\n
"""
body = """
{% if version %}\
## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }}\
{% endfor %}
{% endfor %}\n
"""
trim = true
postprocessors = [
  # The group already names the type: "- feat(release): x" becomes "- **release:** x".
  { pattern = '(?m)^- (?:feat|fix|security|docs|build|ci|test|refactor|perf|chore|revert)\(([^)]+)\)!?: ', replace = "- **${1}:** " },
  { pattern = '(?m)^- (?:feat|fix|security|docs|build|ci|test|refactor|perf|chore|revert)!?: ', replace = "- " },
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/JoeHazurmoney/architecture-wiredata-to-log/pull/${1}))" },
]

[git]
# Grouped by pattern on the subject as written, so a subject from before the convention
# ("ADR-0006: ...", "0.3.0rc5: ...") keeps its prefix instead of having it parsed as a type.
conventional_commits = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+((a|b|rc)[0-9]+)?$"
sort_commits = "oldest"
commit_parsers = [
  # The convention's types (the HTML comments only order the groups).
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^security", group = "<!-- 2 -->Security" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^build", group = "<!-- 4 -->Build and dependencies" },
  { message = "^ci", group = "<!-- 5 -->CI" },
  { message = "^test", group = "<!-- 6 -->Tests" },
  { message = "^(refactor|perf)", group = "<!-- 7 -->Refactoring" },
  { message = "^chore\\(release\\)", group = "<!-- 8 -->Releases" },
  { message = "^(chore|revert)", group = "<!-- 9 -->Other" },
  # Commits from before the convention (2026-10-12).
  { message = "^Build\\(deps\\)", group = "<!-- 4 -->Build and dependencies" },
  { message = "^(Version |[0-9]+\\.[0-9]+\\.[0-9]+rc[0-9]+:)", group = "<!-- 8 -->Releases" },
  { message = "^Fix", group = "<!-- 1 -->Fixes" },
  { message = "^(ADR-|Docs )", group = "<!-- 3 -->Documentation" },
  { message = ".*", group = "<!-- 9 -->Other" },
]
