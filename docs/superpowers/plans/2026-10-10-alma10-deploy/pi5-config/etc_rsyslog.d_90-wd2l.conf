# wd2l single-box demo: rsyslog stands in for the log aggregator (docs/deployment/log-server.md, section 5).
# Every message the host logs goes to wd2l-sender on 127.0.0.1:10070 as one JSON object per line.
# rsyslog can't send the optional {"authToken": ...} first line, so sender.env has no --auth-token-file.
# SELinux: rsyslogd may only connect to syslog ports, so: semanage port -a -t syslogd_port_t -p tcp 10070
template(name="wd2l_json" type="list" option.jsonf="on") {
  property(outname="_raw"       name="$!wd2l_raw"     format="jsonf")
  property(outname="_time"      name="timereported"   format="jsonf" dateFormat="unixtimestamp" datatype="number")
  property(outname="host"       name="hostname"       format="jsonf")
  property(outname="source"     name="programname"    format="jsonf")
  constant(outname="sourcetype" value="syslog"        format="jsonf")
  constant(outname="index"      value="enclave1"      format="jsonf")
}
template(name="wd2l_trad" type="string" string="%timereported% %hostname% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%")

ruleset(name="wd2l_out") {
  set $!wd2l_raw = exec_template("wd2l_trad");
  # Persistent (disk-assisted) queue: nothing is lost while the sender restarts.
  action(type="omfwd" target="127.0.0.1" port="10070" protocol="tcp" TCP_Framing="traditional"
         template="wd2l_json"
         queue.type="LinkedList" queue.filename="wd2l_fwd" queue.maxDiskSpace="1g"
         queue.saveOnShutdown="on" action.resumeRetryCount="-1" action.resumeInterval="5")
}
*.* call wd2l_out
