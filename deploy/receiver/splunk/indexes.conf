# Example SIEM configuration (Splunk). Any SIEM works; see docs/deployment/receiver.md.
#
# Enclave 2 Splunk. Put in an app, e.g. $SPLUNK_HOME/etc/apps/wd2l/local/indexes.conf
#
# Every index name Enclave 1 uses must exist here too (HEC rejects the whole batch if an
# event names an index that does not exist or the token may not write to). Either create
# them all, or run the receiver with --force-index to put everything in one index.

[enclave1]
homePath   = $SPLUNK_DB/enclave1/db
coldPath   = $SPLUNK_DB/enclave1/colddb
thawedPath = $SPLUNK_DB/enclave1/thaweddb

# wd2l's own health / gap / heartbeat records
[wd2l]
homePath   = $SPLUNK_DB/wd2l/db
coldPath   = $SPLUNK_DB/wd2l/colddb
thawedPath = $SPLUNK_DB/wd2l/thaweddb

# wd2l audit records from both enclaves (sourcetypes wd2l:audit, wd2l:sender:audit). Readable only
# by the wd2l_auditor role (authorize.conf). Kept 1 year (366 days), like the files on each host.
[wd2l_audit]
homePath   = $SPLUNK_DB/wd2l_audit/db
coldPath   = $SPLUNK_DB/wd2l_audit/colddb
thawedPath = $SPLUNK_DB/wd2l_audit/thaweddb
frozenTimePeriodInSecs = 31622400
