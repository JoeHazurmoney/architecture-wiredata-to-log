# Example SIEM configuration (Splunk). Any SIEM works; see docs/deployment/receiver.md.
#
# Indexed fields the receiver adds to every imported event (sent in the HEC "fields" object).
#   wd2l_stream     sender run the event came from (new value every time wd2l-sender restarts)
#   wd2l_seq        the event's sequence number in that stream
#   wd2l_truncated  only on events cut down by the sender: the original _raw size in bytes
#   wd2l_src_seq    only with wd2l-sender --source-seq: the event's line number in its file
#                   (per host and source, in this sender run)
#   wd2l_tx_time    when wd2l-sender sent the event (epoch seconds, Enclave 1 clock)
#   wd2l_rx_time    when wd2l-receiver got it (epoch seconds, Enclave 2 clock)
# Example: find an exact event   index=enclave1 wd2l_stream=63ba11a93b73e5c6 wd2l_seq=57
# Example: delays by segment     see docs/operations.md, "Measuring delays"

[wd2l_stream]
INDEXED = true

[wd2l_seq]
INDEXED = true

[wd2l_truncated]
INDEXED = true

[wd2l_src_seq]
INDEXED = true

[wd2l_tx_time]
INDEXED = true

[wd2l_rx_time]
INDEXED = true
