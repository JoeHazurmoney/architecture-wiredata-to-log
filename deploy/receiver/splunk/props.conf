# Example SIEM configuration (Splunk). Any SIEM works; see docs/deployment/receiver.md.
#
# Imported events keep their original sourcetype, so the TAs you already use in Enclave 1
# (Palo Alto, Windows, VMware, ...) give the same search-time fields here: install them
# in Enclave 2 too. The event time comes from Enclave 1's _time; line breaking was
# already done by Cribl, so nothing is re-broken or re-timestamped.

[wd2l:health]
KV_MODE = json
