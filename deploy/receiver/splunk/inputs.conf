# Example SIEM configuration (Splunk). Any SIEM works; see docs/deployment/receiver.md.
#
# HTTP Event Collector token for wd2l-receiver.
# Generate the token with: uuidgen   (put the same value in /etc/wd2l/hec.token on the receiver)

[http]
disabled = 0
enableSSL = 1
port = 8088

[http://wd2l]
disabled = 0
token = 00000000-0000-0000-0000-000000000000
index = enclave1
# Every index Enclave 1 sends to, plus wd2l for health records:
# Never wd2l_audit: audit records come in on their own token (below).
indexes = enclave1,wd2l
useACK = false

# Audit records only (wd2l-receiver --hec-audit-token-file /etc/wd2l/hec-audit.token).
[http://wd2l_audit]
disabled = 0
token = 11111111-1111-1111-1111-111111111111
index = wd2l_audit
indexes = wd2l_audit
useACK = false
