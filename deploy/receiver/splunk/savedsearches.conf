# Example SIEM configuration (Splunk). Any SIEM works; see docs/deployment/receiver.md.
#
# wd2l alerts. Add your alert actions (email, etc.) to each stanza.
# All health records: index=wd2l sourcetype=wd2l:health

[WD2L - Events lost in transfer]
description = The receiver declared a gap. reason=receiver_restart or output_dropped: replay the pcap archive. reason=not_received: see docs/operations.md.
search = index=wd2l sourcetype=wd2l:health type=gap \
| eval reason=coalesce(reason, "not_received") \
| stats sum(count) as lost_events, min(first_seq) as first_seq, max(last_seq) as last_seq by host, stream, reason
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1

[WD2L - Heartbeat stale]
description = No sender heartbeat for longer than --hb-timeout: sender, Cribl host, cable, Gigamon or fiber is down.
search = index=wd2l sourcetype=wd2l:health type IN (heartbeat_stale, stream_lost) \
| table _time host type age_s idle_s stream last_seq
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1

[WD2L - Sender run missing or restart chain broken]
description = A whole sender run was never seen in Enclave 2 (for example the sender restarted during a link outage), the sender's restart count reset, or a stream with open gaps was dropped from tracking.
search = index=wd2l sourcetype=wd2l:health type IN (stream_missing, sender_boot_reset, stream_evicted) \
| table _time host type stream boot first_boot last_boot runs last_seq open_gap_events
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1

[WD2L - Receiver silent]
description = No health records from the receiver in 15 minutes (receiver down, or HEC not accepting its data).
search = | tstats count where index=wd2l sourcetype=wd2l:health earliest=-15m latest=now | where count=0
cron_schedule = */15 * * * *
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1

[WD2L - Unexpected traffic or damage on the tap]
description = Packets that are not the log flow, corrupt frames, kernel capture drops, sender-side drops, truncation or unread input at shutdown, HEC rejections, or events the receiver's output had to drop, that grew in the last 20 minutes. Counters are cumulative per receiver/sender run, so range() is the increase.
search = index=wd2l sourcetype=wd2l:health type=health \
| stats range(other_packets) as other_packets range(bad_frames) as bad_frames \
        range(bad_events) as bad_events range(digest_mismatch) as digest_mismatch \
        range(kernel_drops) as kernel_drops range(sender_drops) as sender_drops \
        range(sender_truncated) as sender_truncated range(hec_rejected_events) as hec_rejected \
        range(output_dropped) as output_dropped range(sender_unread_bytes) as sender_unread_bytes \
        by host \
| where other_packets>0 OR bad_frames>0 OR bad_events>0 OR digest_mismatch>0 OR kernel_drops>0 \
        OR sender_drops>0 OR sender_truncated>0 OR hec_rejected>0 OR output_dropped>0 \
        OR sender_unread_bytes>0
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time = @m
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
