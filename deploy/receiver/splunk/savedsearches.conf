# Example SIEM configuration (Splunk). Any SIEM works; see docs/deployment/receiver.md.
#
# wd2l alerts. Add your alert actions (email, etc.) to each stanza.
# All health records: index=wd2l sourcetype=wd2l:health

[WD2L - Events lost in transfer]
description = The receiver declared a gap. reason=receiver_restart or output_dropped: replay the pcap archive. reason=not_received: see docs/operations.md.
search = index=wd2l sourcetype=wd2l:health type=gap \
| eval reason=coalesce(reason, "not_received") \
| stats sum(count) as lost_events, min(first_seq) as first_seq, max(last_seq) as last_seq by host, stream, reason
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1

[WD2L - Heartbeat stale]
description = No sender heartbeat for longer than --hb-timeout: sender, Cribl host, cable, Gigamon or fiber is down.
search = index=wd2l sourcetype=wd2l:health type IN (heartbeat_stale, stream_lost) \
| table _time host type age_s idle_s stream last_seq
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1

[WD2L - Sender run missing or restart chain broken]
description = A whole sender run was never seen in Enclave 2 (for example the sender restarted during a link outage), the sender's restart count reset, or a stream with open gaps was dropped from tracking.
search = index=wd2l sourcetype=wd2l:health type IN (stream_missing, sender_boot_reset, stream_evicted) \
| table _time host type stream boot first_boot last_boot runs last_seq open_gap_events
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1

[WD2L - Receiver silent]
description = No health records from the receiver in 15 minutes (receiver down, or HEC not accepting its data).
search = | tstats count where index=wd2l sourcetype=wd2l:health earliest=-15m latest=now | where count=0
cron_schedule = */15 * * * *
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1

[WD2L - Unexpected traffic or damage on the tap]
description = Packets that are not the log flow, corrupt frames, refused Enclave 1 records (records_bad: malformed, or not naming the Enclave 1 sender), kernel capture drops, sender-side drops, truncation or unread input at shutdown, HEC rejections, or events the receiver's output had to drop, that grew in the last 20 minutes. Counters are cumulative per receiver/sender run, so range() is the increase.
search = index=wd2l sourcetype=wd2l:health type=health \
| stats range(other_packets) as other_packets range(bad_frames) as bad_frames \
        range(bad_events) as bad_events range(digest_mismatch) as digest_mismatch \
        range(kernel_drops) as kernel_drops range(sender_drops) as sender_drops \
        range(sender_truncated) as sender_truncated range(hec_rejected_events) as hec_rejected \
        range(output_dropped) as output_dropped range(sender_unread_bytes) as sender_unread_bytes \
        range(records_bad) as records_bad \
        by host \
| where other_packets>0 OR bad_frames>0 OR bad_events>0 OR digest_mismatch>0 OR kernel_drops>0 \
        OR sender_drops>0 OR sender_truncated>0 OR hec_rejected>0 OR output_dropped>0 \
        OR sender_unread_bytes>0 OR records_bad>0
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time = @m
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1

[WD2L - Opaque content in imported logs]
description = Events from Enclave 1 carrying a long blob that can't be inspected (encrypted, compressed or random-looking; indexed field wd2l_opaque). They crossed unchanged. Check whether the source is known to log such data: see docs/operations.md. Add your other import indexes to the search.
search = index=enclave1 wd2l_opaque=* \
| stats count, max(wd2l_opaque_bytes) as max_bytes, values(wd2l_opaque) as kinds by host, source, sourcetype
cron_schedule = */15 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = @m
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1

[WD2L - Fault segment]
description = The receiver's answer to "where is the fault" moved away from ok. fault_segment is the segment (e1-input, e1-sender, boundary, e2-capture, e2-receiver, e2-siem), fault_rule the rule that matched, fault_detail what to check. See docs/state-of-health.md. Mute it during planned downtime (docs/planned-downtime.md).
search = index=wd2l sourcetype=wd2l:health type=fault fault_status!=ok \
| table _time host fault_status fault_segment fault_rule fault_detail previous_status
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1

[WD2L - Reconciliation not balanced]
description = A sender run with no open gaps hasn't balanced end to end for an hour: events were changed or misnumbered on the way, and nothing says why. Treat it as an incident. Streams with open gaps are left to "Events lost in transfer": a stream with a permanent gap (lost before capture, re-sent from Enclave 1) never balances again. See docs/operations.md and docs/audit-and-health.md section 7.
search = index=wd2l sourcetype=wd2l:health type=reconcile \
| stats count(eval(balanced="true")) as balanced_checks latest(cut) as cut latest(gaps_open) as gaps_open by host, stream \
| where balanced_checks=0 AND gaps_open=0
cron_schedule = 0 * * * *
dispatch.earliest_time = -65m@m
dispatch.latest_time = @m
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1

[WD2L - Audit trail]
description = An audit file can't be written or its disk is low (audit_ok=false), or the daily self-check of the hash chain failed (audit_verify=failed), on either side. The transfer keeps going. See docs/operations.md.
search = index=wd2l type=health (sourcetype=wd2l:health OR sourcetype=wd2l:sender:health) (audit_ok=false OR audit_verify=failed) \
| stats latest(_time) as last latest(audit_ok) as audit_ok latest(audit_verify) as audit_verify latest(audit_n) as audit_n by host, component
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time = @m
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1

[WD2L - Time quality]
description = Time is unsynchronised, above stratum 3, more than 100 ms off or unreadable (chrony unavailable) on either side, or the two enclaves' clocks differ by more than 50 ms. Events still arrive, but their times can't be trusted. See docs/operations.md.
search = index=wd2l sourcetype=wd2l:health ((type=time_status time_status=alarm) OR (type=health time_status=alarm)) \
| stats latest(_time) as last latest(time_reason) as reason by host
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time = @m
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1

[WD2L - Audit review (daily)]
description = Changes and operator actions for review, yesterday: configuration changed, state file reset, archive replays, debug toggled, audit failures, self-checks, time quality changes. A report, not an alert. Its owner needs the wd2l_auditor role.
search = index=wd2l_audit event IN (config_changed, state_reset, replay_run, debug_toggled, audit_failure, audit_verify, time_quality) \
| table _time host component sourcetype event outcome actor reason level files old_config_sha256 config_sha256
cron_schedule = 0 7 * * *
dispatch.earliest_time = -1d@d
dispatch.latest_time = @d
enableSched = 1
